name: ESP32 CI Build

# Trigger the workflow on push or pull request to the main/master branch
on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    tags:
      - 'v*' 
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python (PlatformIO Core is written in Python)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      # 3. Cache PlatformIO packages and libraries to speed up future builds
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      # 4. Install PlatformIO Core
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      # 5. Install libraries/dependencies defined in platformio.ini
      - name: Install Library Dependencies
        run: pio pkg install


      # 6. Set Firmware Name based on whether it's a tag or a test build
      - name: Set Firmware Name
        id: firmware_name
        run: |
          # Si c'est déclenché par un tag, on utilise le tag, sinon "test-build"
          echo "VERSION=test-build" >> $GITHUB_ENV
          if [[ $GITHUB_REF_TYPE == 'tag' ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      # 7. Compile the firmware
      - name: Build Firmware
        run: pio run -e esp32doit-devkit-v1

      # 8. Rename the output firmware file
      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.VERSION }}
          path: firmware-${{ env.VERSION }}.bin

        
