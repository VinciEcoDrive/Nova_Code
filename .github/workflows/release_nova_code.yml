name: release_nova_code

# Release workflow: run only when a version tag is pushed
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Install Library Dependencies
        run: pio pkg install

      - name: Build Firmware
        run: |
          export PLATFORMIO_BUILD_FLAGS="-D VERSION=\"$VERSION\""
          pio run -e esp32doit-devkit-v1

      - name: Rename Firmware
        run: mv .pio/build/esp32doit-devkit-v1/firmware.bin firmware-${VERSION}.bin

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.VERSION }}.bin
          path: firmware-${{ env.VERSION }}.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Firmware ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: firmware-${{ env.VERSION }}.bin
